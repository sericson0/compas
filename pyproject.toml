[project]
name = "compas"
version = "0.1.0"
description = "COMPAS - musical feature analysis for Argentine tango (BPM, key, energy, rubato) with a GUI and CLI"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "librosa>=0.11",
    "soundfile",
    "mutagen",
    "pyloudnorm",
    "PySide6",
]

[project.scripts]
compas = "compas_cli:main"

[project.gui-scripts]
compas-gui = "compas_gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["compas_core", "compas_gui"]
py-modules = ["compas_cli"]
