name: Build executables

# Builds the Windows .exe and the macOS .app with PyInstaller.
# Runs on manual trigger (Actions tab -> "Build executables" -> Run workflow)
# and on version tags (v*). Download the results from the run's Artifacts.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      # One dead target must not cancel the healthy ones. Without this, the
      # Intel Mac job failing during pip install cancelled the Windows and
      # Apple Silicon builds a minute in, so a run that should have produced
      # two artifacts produced none.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: COMPAS-windows
            bundle: dist/COMPAS
          - os: macos-latest        # Apple Silicon
            artifact: COMPAS-macos
            bundle: dist/COMPAS-macos.zip
          # No Intel Mac build. llvmlite — pulled in by numba, pulled in by
          # librosa — has published arm64-only macOS wheels since 0.46, so an
          # x86_64 runner falls back to compiling LLVM from source and fails.
          # Pinning llvmlite<0.46 would work but freezes that build's whole
          # numba/librosa stack. Intel Macs can still be built from source on
          # the machine itself with packaging/build_macos.sh.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build
        run: python -m PyInstaller packaging/compas.spec --noconfirm

      # upload-artifact zips its input itself, and that zip preserves neither
      # Unix permissions nor symlinks. Handing it dist/COMPAS.app produced an
      # unusable download: the .app wrapper was stripped to a bare Contents/
      # folder, every Qt framework's Versions/Current symlink was replaced by
      # a full copy (892 MB unpacked, against 363 MB on Windows), and the
      # executable bit was gone from Contents/MacOS/COMPAS, so nothing would
      # launch. ditto writes a real bundle archive; the double-zip on download
      # is the price of keeping the bundle intact.
      - name: Package the .app so the bundle survives the upload
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/COMPAS.app dist/COMPAS-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
